<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя станція - Growatt</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #141b2d;
      --card-border: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-orange: #f59e0b;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      margin: 0;
    }

    /* Верхняя панель */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
    }
    .station-title h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }
    .station-title p {
      margin: 2px 0 0 0;
      font-size: 13px;
      color: var(--text-muted);
    }
    .online-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-green);
    }
    .online-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
    }

    /* Карточка схемы */
    .schema-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 16px;
      position: relative;
    }

    .top-metrics {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .metric-badge {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 8px 14px;
      border-radius: 14px;
      text-align: center;
    }
    .metric-badge span { display: block; color: var(--text-muted); font-size: 11px; margin-bottom: 2px; }
    .metric-badge strong { font-size: 14px; font-weight: 600; }

    /* Центральная батарея сверху */
    .battery-pill {
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.25);
      border-radius: 20px;
      padding: 8px 20px;
      text-align: center;
    }
    .battery-pill h2 { margin: 0; font-size: 22px; color: var(--accent-green); font-weight: 700; }
    .battery-pill span { font-size: 11px; color: var(--text-muted); }

    /* Графика схемы (SVG) */
    .schema-svg-container {
      position: relative;
      width: 100%;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    svg { width: 100%; height: 100%; overflow: visible; }

    .flow-line {
      stroke-dasharray: 6;
      animation: dash 1s linear infinite;
    }
    @keyframes dash {
      to { stroke-dashoffset: -12; }
    }

    /* Плашка разряда снизу схемы */
    .discharge-pill {
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.25);
      border-radius: 16px;
      padding: 8px 16px;
      text-align: center;
      width: 150px;
      margin: 14px auto 0 auto;
    }
    .discharge-pill strong { color: var(--accent-green); font-size: 14px; display: block; }
    .discharge-pill span { font-size: 11px; color: var(--text-muted); }

    /* Главный статус-баннер */
    .status-banner {
      border-radius: 20px;
      padding: 16px 20px;
      text-align: center;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }
    .status-banner.offline {
      background: linear-gradient(135deg, #381305 0%, #691313 100%);
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .status-banner.online {
      background: linear-gradient(135deg, #04382c 0%, #064e3b 100%);
      border: 1px solid rgba(34, 197, 94, 0.35);
    }
    .status-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .status-banner.offline .status-icon { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }
    .status-banner.online .status-icon { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); }
    
    .status-text { text-align: left; }
    .status-text h3 { margin: 0; font-size: 17px; font-weight: 700; }
    .status-text p { margin: 2px 0 0 0; font-size: 13px; color: #cbd5e1; }

    /* Сетка трех показателей */
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px 10px;
      text-align: center;
    }
    .stat-card p { margin: 0 0 6px 0; font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 500; }
    .stat-card h4 { margin: 0; font-size: 17px; font-weight: 700; }

    /* Таймлайн графика света */
    .timeline-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: 600;
    }
    .timeline-bar {
      height: 12px;
      background: #1e293b;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 10px;
      display: flex;
    }
    .timeline-fill-green { background: var(--accent-green); height: 100%; }
    .timeline-fill-orange { background: var(--accent-orange); height: 100%; }
    
    .timeline-hours {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
    }
    .timeline-legend {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
  </style>
</head>
<body>

  <!-- Верхняя шапка -->
  <div class="top-bar">
    <div class="station-title">
      <h1>Моя станція</h1>
      <p>Growatt Energy System</p>
    </div>
    <div class="online-badge">
      <div class="online-dot"></div>
      Онлайн
    </div>
  </div>

  <!-- Главная карточка схемы -->
  <div class="schema-card">
    <div class="top-metrics">
      <div class="metric-badge">
        <span>Міська мережа</span>
        <strong id="grid-voltage-val">-- V</strong>
      </div>
      
      <div class="battery-pill">
        <h2 id="battery-soc-top">--%</h2>
        <span id="battery-kwh">-- кВт·ч</span>
      </div>

      <div class="metric-badge">
        <span>Квартира</span>
        <strong id="load-power-top">-- кВт</strong>
      </div>
    </div>

    <!-- SVG Схема потоков -->
    <div class="schema-svg-container">
      <svg viewBox="0 0 320 100" xmlns="http://www.w3.org/2000/svg">
        <!-- Линия сеть - инвертор -->
        <path id="path-grid-bg" d="M 55 50 L 130 50" stroke="#1e293b" stroke-width="4" stroke-linecap="round" fill="none" />
        <path id="path-grid-flow" d="M 55 50 L 130 50" class="flow-line" stroke="#22c55e" stroke-width="4" stroke-linecap="round" fill="none" visibility="hidden" />
        <circle id="grid-cross" cx="92" cy="50" r="10" fill="#ef4444" visibility="visible" />
        <text x="92" y="54" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">✕</text>

        <!-- Линия инвертор - дом -->
        <path d="M 170 50 L 255 50" stroke="#1e293b" stroke-width="4" stroke-linecap="round" fill="none" />
        <path d="M 170 50 L 255 50" class="flow-line" stroke="#22c55e" stroke-width="4" stroke-linecap="round" fill="none" />

        <!-- Иконка Сеть -->
        <g transform="translate(25, 25)">
          <text x="15" y="30" font-size="24" text-anchor="middle">⚡️</text>
        </g>

        <!-- Инвертор Growatt -->
        <g transform="translate(130, 20)">
          <rect x="0" y="0" width="40" height="60" rx="8" fill="#141b2d" stroke="#f59e0b" stroke-width="2"/>
          <text x="20" y="35" font-size="18" text-anchor="middle">⚡</text>
        </g>

        <!-- Дом -->
        <g transform="translate(240, 25)">
          <text x="20" y="30" font-size="26" text-anchor="middle">🏠</text>
        </g>
      </svg>
    </div>

    <!-- Плашка разряда снизу -->
    <div class="discharge-pill">
      <strong id="discharge-val">-- кВт</strong>
      <span id="discharge-mode">Розряд батареї</span>
    </div>
  </div>

  <!-- Статус-баннер -->
  <div id="status-banner" class="status-banner offline">
    <div class="status-icon">⚡</div>
    <div class="status-text">
      <h3 id="banner-title">Світла немає</h3>
      <p id="banner-subtitle">Живлення від батареї</p>
    </div>
  </div>

  <!-- Три плашки метрик снизу -->
  <div class="grid-3">
    <div class="stat-card">
      <p>Вихідна напруга</p>
      <h4 id="out-voltage">230 V</h4>
    </div>
    <div class="stat-card">
      <p>Споживання</p>
      <h4 id="load-power-bot">-- кВт</h4>
    </div>
    <div class="stat-card">
      <p>Мережа</p>
      <h4 id="grid-status-val" style="color: var(--accent-red);">0 V</h4>
    </div>
  </div>

  <!-- График света за день -->
  <div class="timeline-card">
    <div class="timeline-header">
      <span>📅 Графік світла • <span id="current-date">Сьогодні</span></span>
    </div>
    <div class="timeline-bar">
      <div class="timeline-fill-orange" style="width: 45%;"></div>
      <div class="timeline-fill-green" style="width: 55%;"></div>
    </div>
    <div class="timeline-hours">
      <span>00:00</span>
      <span>06:00</span>
      <span>12:00</span>
      <span>18:00</span>
      <span>24:00</span>
    </div>
    <div class="timeline-legend">
      <div class="legend-item"><div class="dot" style="background:var(--accent-green)"></div> Світло є</div>
      <div class="legend-item"><div class="dot" style="background:var(--accent-orange)"></div> Світла немає</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://nzpfbvrbwmxhhpajgyjj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_htg_8lgoGKWP7Dx7eVlhDg_eLnr3Y10";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    const options = { day: 'numeric', month: 'numeric' };
    document.getElementById('current-date').innerText = "Сьогодні, " + new Date().toLocaleDateString('uk-UA', options);

    async function fetchLatestData() {
      try {
        const { data, error } = await client
          .from('power_logs')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(1);

        if (error) { console.error(error); return; }

        if (data && data.length > 0) {
          const last = data[0];
          
          const hasGrid = last.grid_status === true || last.grid_status === "true";
          const soc = last.battery_soc || 0;
          const loadW = last.load_power || 0;
          const loadKw = (loadW / 1000).toFixed(2);
          const approxKwh = (soc * 0.10).toFixed(2);

          const banner = document.getElementById('status-banner');
          const bannerTitle = document.getElementById('banner-title');
          const bannerSub = document.getElementById('banner-subtitle');
          const gridFlow = document.getElementById('path-grid-flow');
          const gridCross = document.getElementById('grid-cross');
          const gridVoltageVal = document.getElementById('grid-voltage-val');
          const gridStatusVal = document.getElementById('grid-status-val');
          const dischargeVal = document.getElementById('discharge-val');
          const dischargeMode = document.getElementById('discharge-mode');

          document.getElementById('battery-soc-top').innerText = soc + '%';
          document.getElementById('battery-kwh').innerText = approxKwh + ' кВт·ч';
          document.getElementById('load-power-top').innerText = loadKw + ' кВт';
          document.getElementById('load-power-bot').innerText = loadKw + ' кВт';

          // Используем новые поля, если они заполнены, иначе берем логику из основных
          const gridV = last.grid_voltage !== null && last.grid_voltage !== undefined ? last.grid_voltage : (hasGrid ? 230 : 0);
          const dischargeKw = last.discharge_power !== null && last.discharge_power !== undefined ? last.discharge_power : loadKw;

          gridVoltageVal.innerText = gridV + ' V';
          dischargeVal.innerText = dischargeKw + ' кВт';

          if (hasGrid) {
            banner.className = "status-banner online";
            bannerTitle.innerText = "Мережа активна";
            bannerSub.innerText = "Живлення від міської мережі";
            gridFlow.setAttribute("visibility", "visible");
            gridCross.setAttribute("visibility", "hidden");
            gridStatusVal.innerText = gridV + ' V';
            gridStatusVal.style.color = "var(--accent-green)";
            dischargeMode.innerText = "Споживання / Заряд";
          } else {
            banner.className = "status-banner offline";
            bannerTitle.innerText = "Світла немає";
            bannerSub.innerText = "Живлення від батареї";
            gridFlow.setAttribute("visibility", "hidden");
            gridCross.setAttribute("visibility", "visible");
            gridStatusVal.innerText = "0 V";
            gridStatusVal.style.color = "var(--accent-red)";
            dischargeMode.innerText = "Розряд батареї";
          }
        }
      } catch (err) {
        console.error("Fetch error:", err);
      }
    }

    fetchLatestData();
    setInterval(fetchLatestData, 20000);
  </script>
</body>
</html>
