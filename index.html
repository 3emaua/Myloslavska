<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя станція - Growatt</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root {
      --bg-color: #070913;
      --card-bg: rgba(20, 27, 45, 0.75);
      --card-border: rgba(255, 255, 255, 0.07);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-orange: #f59e0b;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(245, 158, 11, 0.05) 0%, transparent 40%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      margin: 0;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 4px;
    }
    .station-title h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .station-title p {
      margin: 2px 0 0 0;
      font-size: 13px;
      color: var(--text-muted);
    }
    
    .top-right-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Кнопка обновления */
    .refresh-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
      transition: background 0.2s;
    }
    .refresh-btn:active {
      background: rgba(255, 255, 255, 0.15);
    }
    .refresh-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      transition: transform 0.6s ease;
    }
    .refresh-btn.spinning svg {
      transform: rotate(360deg);
    }

    .online-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-green);
      background: rgba(34, 197, 94, 0.1);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(34, 197, 94, 0.2);
    }
    .online-dot {
      width: 7px;
      height: 7px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-green);
      animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    .schema-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    .top-metrics {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .metric-badge {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 14px;
      border-radius: 16px;
      text-align: center;
      flex: 1;
      max-width: 95px;
    }
    .metric-badge span { display: block; color: var(--text-muted); font-size: 10px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .metric-badge strong { font-size: 13px; font-weight: 700; }

    .battery-pill {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(20, 27, 45, 0.8));
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 22px;
      padding: 8px 18px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.1);
      flex: 1.2;
      margin: 0 8px;
    }
    .battery-pill h2 { margin: 0; font-size: 20px; color: var(--accent-green); font-weight: 800; letter-spacing: -0.5px; }
    .battery-pill span { font-size: 10px; color: var(--text-muted); }

    .schema-svg-container {
      position: relative;
      width: 100%;
      height: 140px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 4px 0;
    }
    svg { width: 100%; height: 100%; overflow: visible; }

    .flow-line {
      stroke-dasharray: 6 8;
      animation: dashLine 1s linear infinite;
    }
    @keyframes dashLine {
      to { stroke-dashoffset: -14; }
    }

    #battery-level-bar {
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .discharge-pill {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 10px 20px;
      text-align: center;
      width: fit-content;
      margin: 12px auto 0 auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .discharge-pill strong { color: var(--accent-green); font-size: 15px; font-weight: 700; display: block; }
    .discharge-pill span { font-size: 11px; color: var(--text-muted); }

    .status-banner {
      border-radius: 24px;
      padding: 18px 22px;
      text-align: center;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    }
    .status-banner.offline {
      background: linear-gradient(135deg, rgba(69, 10, 10, 0.9) 0%, rgba(30, 9, 9, 0.95) 100%);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .status-banner.online {
      background: linear-gradient(135deg, rgba(6, 78, 59, 0.9) 0%, rgba(4, 47, 36, 0.95) 100%);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .status-icon {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.15);
    }
    .status-banner.offline .status-icon { background: rgba(239, 68, 68, 0.25); color: var(--accent-red); }
    .status-banner.online .status-icon { background: rgba(34, 197, 94, 0.25); color: var(--accent-green); }
    
    .status-text { text-align: left; }
    .status-text h3 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .status-text p { margin: 3px 0 0 0; font-size: 13px; color: #cbd5e1; }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px 10px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .stat-card p { margin: 0 0 6px 0; font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
    .stat-card h4 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.5px; }

    .timeline-card {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: 700;
    }
    .timeline-bar {
      height: 14px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 7px;
      overflow: hidden;
      margin-bottom: 10px;
      display: flex;
      padding: 2px;
    }
    .timeline-fill-green { background: linear-gradient(90deg, #16a34a, #22c55e); height: 100%; border-radius: 5px; }
    .timeline-fill-orange { background: linear-gradient(90deg, #d97706, #f59e0b); height: 100%; border-radius: 5px; }
    
    .timeline-hours {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .timeline-legend {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .legend-item { display: flex; align-items: center; gap: 6px; font-weight: 500; }
    .dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="station-title">
      <h1>Моя станція</h1>
      <p>Growatt Energy System</p>
    </div>
    <div class="top-right-actions">
      <!-- Кнопка принудительного обновления -->
      <button class="refresh-btn" id="refresh-btn" onclick="manualRefresh()" title="Оновити дані">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
      <div class="online-badge">
        <div class="online-dot"></div>
        Онлайн
      </div>
    </div>
  </div>

  <div class="schema-card">
    <div class="top-metrics">
      <div class="metric-badge">
        <span>Міська мережа</span>
        <strong id="grid-voltage-val">-- V</strong>
      </div>
      
      <div class="battery-pill">
        <h2 id="battery-soc-top">--%</h2>
        <span id="battery-kwh">-- кВт·ч</span>
      </div>

      <div class="metric-badge">
        <span>Квартира</span>
        <strong id="load-power-top">-- кВт</strong>
      </div>
    </div>

    <!-- Схема -->
    <div class="schema-svg-container">
      <svg viewBox="0 0 360 135" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
          <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <path d="M 65 45 L 145 45" stroke="#1e293b" stroke-width="4" stroke-linecap="round" fill="none" />
        <path id="path-grid-flow" d="M 65 45 L 145 45" class="flow-line" stroke="#22c55e" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#glow-green)" visibility="hidden" />
        
        <g id="grid-cross-group" transform="translate(105, 45)">
          <circle cx="0" cy="0" r="11" fill="#ef4444" opacity="0.9" />
          <text x="0" y="4" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">✕</text>
        </g>

        <path d="M 215 45 L 290 45" stroke="#1e293b" stroke-width="4" stroke-linecap="round" fill="none" />
        <path id="path-house-flow" d="M 215 45 L 290 45" class="flow-line" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#glow-orange)" />

        <path d="M 180 95 L 180 75" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />
        <path id="path-bat-flow" d="M 180 95 L 180 75" class="flow-line" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow-orange)" />
        <polygon id="bat-arrow" points="176,77 184,77 180,71" fill="#f59e0b" />

        <g transform="translate(25, 20)">
          <rect x="0" y="0" width="40" height="50" rx="12" fill="#141b2d" stroke="#334155" stroke-width="1.5" />
          <text x="20" y="31" font-size="22" text-anchor="middle">🗼</text>
        </g>

        <g transform="translate(145, 12)">
          <rect x="0" y="0" width="70" height="66" rx="14" fill="#141b2d" stroke="#f59e0b" stroke-width="2.5" />
          <circle cx="35" cy="30" r="15" fill="#0b0f19" stroke="#f59e0b" stroke-width="1.5" />
          <text x="35" y="36" font-size="16" text-anchor="middle">⚡</text>
          <text x="35" y="56" font-size="8" text-anchor="middle" fill="#94a3b8" font-weight="bold" letter-spacing="0.5">GROWATT</text>
        </g>

        <g transform="translate(135, 95)">
          <rect x="0" y="0" width="90" height="26" rx="8" fill="#070913" stroke="#22c55e" stroke-width="1.5" />
          <rect x="6" y="5" width="60" height="16" rx="4" fill="#22c55e" opacity="0.15" />
          <rect id="battery-level-bar" x="6" y="5" width="30" height="16" rx="4" fill="#22c55e" />
          <text x="78" y="18" font-size="11" fill="#22c55e" font-weight="bold">🔋 АКБ</text>
        </g>

        <g transform="translate(285, 12)">
          <rect x="0" y="0" width="55" height="66" rx="14" fill="#141b2d" stroke="#334155" stroke-width="2" />
          <text x="27.5" y="34" font-size="28" text-anchor="middle">🏢</text>
          <text x="27.5" y="56" font-size="9" text-anchor="middle" fill="#94a3b8" font-weight="bold">КВАРТИРА</text>
        </g>
      </svg>
    </div>

    <div class="discharge-pill">
      <strong id="discharge-val">-- кВт</strong>
      <span id="discharge-mode">Розряд батареї</span>
    </div>
  </div>

  <div id="status-banner" class="status-banner offline">
    <div class="status-icon">⚡</div>
    <div class="status-text">
      <h3 id="banner-title">Світла немає</h3>
      <p id="banner-subtitle">Живлення від батареї</p>
    </div>
  </div>

  <div class="grid-3">
    <div class="stat-card">
      <p>Вихідна напруга</p>
      <h4 id="out-voltage">230 V</h4>
    </div>
    <div class="stat-card">
      <p>Споживання</p>
      <h4 id="load-power-bot">-- кВт</h4>
    </div>
    <div class="stat-card">
      <p>Мережа</p>
      <h4 id="grid-status-val" style="color: var(--accent-red);">0 V</h4>
    </div>
  </div>

  <div class="timeline-card">
    <div class="timeline-header">
      <span>📅 Графік світла • <span id="current-date">Сьогодні</span></span>
    </div>
    <div class="timeline-bar">
      <div class="timeline-fill-orange" style="width: 45%;"></div>
      <div class="timeline-fill-green" style="width: 55%;"></div>
    </div>
    <div class="timeline-hours">
      <span>00:00</span>
      <span>06:00</span>
      <span>12:00</span>
      <span>18:00</span>
      <span>24:00</span>
    </div>
    <div class="timeline-legend">
      <div class="legend-item"><div class="dot" style="color:var(--accent-green); background:var(--accent-green)"></div> Світло є</div>
      <div class="legend-item"><div class="dot" style="color:var(--accent-orange); background:var(--accent-orange)"></div> Світла немає</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://nzpfbvrbwmxhhpajgyjj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_htg_8lgoGKWP7Dx7eVlhDg_eLnr3Y10";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    const options = { day: 'numeric', month: 'numeric' };
    document.getElementById('current-date').innerText = "Сьогодні, " + new Date().toLocaleDateString('uk-UA', options);

    async function fetchLatestData() {
      try {
        const { data, error } = await client
          .from('power_logs')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(1);

        if (error) { console.error(error); return; }

        if (data && data.length > 0) {
          const last = data[0];
          
          const hasGrid = last.grid_status === true || last.grid_status === "true";
          const soc = last.battery_soc || 0;
          const loadW = last.load_power || 0;
          const loadKw = (loadW / 1000).toFixed(2);
          const approxKwh = (soc * 0.10).toFixed(2);

          const banner = document.getElementById('status-banner');
          const bannerTitle = document.getElementById('banner-title');
          const bannerSub = document.getElementById('banner-subtitle');
          const gridFlow = document.getElementById('path-grid-flow');
          const gridCross = document.getElementById('grid-cross-group');
          const houseFlow = document.getElementById('path-house-flow');
          const batFlow = document.getElementById('path-bat-flow');
          const batArrow = document.getElementById('bat-arrow');
          const gridVoltageVal = document.getElementById('grid-voltage-val');
          const gridStatusVal = document.getElementById('grid-status-val');
          const dischargeVal = document.getElementById('discharge-val');
          const dischargeMode = document.getElementById('discharge-mode');
          const batteryBar = document.getElementById('battery-level-bar');

          document.getElementById('battery-soc-top').innerText = soc + '%';
          document.getElementById('battery-kwh').innerText = approxKwh + ' кВт·ч';
          document.getElementById('load-power-top').innerText = loadKw + ' кВт';
          document.getElementById('load-power-bot').innerText = loadKw + ' кВт';
          
          batteryBar.setAttribute('width', Math.max(6, (soc / 100) * 60));

          const gridV = last.grid_voltage !== null && last.grid_voltage !== undefined ? last.grid_voltage : (hasGrid ? 230 : 0);
          const dischargeKw = last.discharge_power !== null && last.discharge_power !== undefined ? last.discharge_power : loadKw;

          gridVoltageVal.innerText = gridV + ' V';
          dischargeVal.innerText = dischargeKw + ' кВт';

          if (hasGrid) {
            banner.className = "status-banner online";
            bannerTitle.innerText = "Мережа активна";
            bannerSub.innerText = "Живлення від міської мережі";
            
            gridFlow.setAttribute("visibility", "visible");
            gridFlow.setAttribute("stroke", "#22c55e");
            houseFlow.setAttribute("stroke", "#22c55e");
            
            gridCross.setAttribute("visibility", "hidden");
            batFlow.setAttribute("visibility", "hidden");
            batArrow.setAttribute("visibility", "hidden");

            gridStatusVal.innerText = gridV + ' V';
            gridStatusVal.style.color = "var(--accent-green)";
            dischargeMode.innerText = "Споживання / Заряд АКБ";
          } else {
            banner.className = "status-banner offline";
            bannerTitle.innerText = "Світла немає";
            bannerSub.innerText = "Живлення від батареї";
            
            gridFlow.setAttribute("visibility", "hidden");
            gridCross.setAttribute("visibility", "visible");
            
            houseFlow.setAttribute("stroke", "#f59e0b");
            batFlow.setAttribute("visibility", "visible");
            batArrow.setAttribute("visibility", "visible");
            batFlow.setAttribute("stroke", "#f59e0b");

            gridStatusVal.innerText = "0 V";
            gridStatusVal.style.color = "var(--accent-red)";
            dischargeMode.innerText = "Розряд батареї";
          }
        }
      } catch (err) {
        console.error("Fetch error:", err);
      }
    }

    // Функция ручного обновления при клике на кнопку
    async function manualRefresh() {
      const btn = document.getElementById('refresh-btn');
      btn.classList.add('spinning');
      
      if (window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback) {
        Telegram.WebApp.HapticFeedback.impactOccurred('medium');
      }

      await fetchLatestData();

      setTimeout(() => {
        btn.classList.remove('spinning');
      }, 600);
    }

    fetchLatestData();
    setInterval(fetchLatestData, 20000);
  </script>
</body>
</html>
