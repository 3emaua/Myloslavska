<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sigenergy / Growatt Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root {
      --bg-color: #05070c;
      --card-bg: rgba(13, 17, 28, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --accent-red: #ef4444;
      --accent-purple: #8b5cf6;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 20% 10%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 90%, rgba(16, 185, 129, 0.06) 0%, transparent 40%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 12px;
      margin: 0;
    }

    /* Шапка в стиле Sigenergy */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.5px;
      color: #fff;
    }
    .brand-logo span { color: var(--accent-blue); }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .refresh-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
    }
    .refresh-btn svg { width: 16px; height: 16px; fill: currentColor; transition: transform 0.6s; }
    .refresh-btn.spinning svg { transform: rotate(360deg); }

    .status-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    /* Главная 3D/Схема карточка */
    .hero-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    /* Мини-статистика сверху карточки */
    .hero-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .mini-stat {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 14px;
      padding: 8px 12px;
    }
    .mini-stat span { display: block; font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
    .mini-stat strong { font-size: 14px; font-weight: 700; }

    /* SVG Энерго-граф (дом, инвертор, батарея, ЛЭП) */
    .svg-container {
      width: 100%;
      height: 150px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    svg { width: 100%; height: 100%; overflow: visible; }

    .energy-flow {
      stroke-dasharray: 6 6;
      animation: flowAnim 1s linear infinite;
    }
    @keyframes flowAnim {
      to { stroke-dashoffset: -12; }
    }

    #battery-fill-bar {
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Нижняя панель состояния энергии */
    .flow-status-footer {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .flow-status-left span { font-size: 10px; color: var(--text-muted); display: block; }
    .flow-status-left strong { font-size: 14px; color: var(--accent-green); }
    
    .flow-status-right {
      text-align: right;
    }
    .flow-status-right span { font-size: 10px; color: var(--text-muted); display: block; }
    .flow-status-right strong { font-size: 14px; }

    /* Баннер тревоги / сети */
    .alert-banner {
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .alert-banner.offline {
      background: linear-gradient(135deg, rgba(127, 29, 29, 0.8) 0%, rgba(69, 10, 10, 0.9) 100%);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .alert-banner.online {
      background: linear-gradient(135deg, rgba(6, 78, 59, 0.8) 0%, rgba(4, 47, 36, 0.9) 100%);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .alert-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .alert-banner.offline .alert-icon { background: rgba(239, 68, 68, 0.3); color: var(--accent-red); }
    .alert-banner.online .alert-icon { background: rgba(16, 185, 129, 0.3); color: var(--accent-green); }
    .alert-text h3 { margin: 0; font-size: 15px; font-weight: 700; }
    .alert-text p { margin: 2px 0 0 0; font-size: 12px; color: #cbd5e1; }

    /* Сетка параметров 3 в ряд */
    .metrics-grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .metric-card {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 8px;
      text-align: center;
    }
    .metric-card span { font-size: 9px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; display: block; margin-bottom: 4px; }
    .metric-card strong { font-size: 15px; font-weight: 800; }

    /* Эко-карточка графиков / таймлайна */
    .analytics-card {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
    }
    .analytics-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }
    .timeline-bar {
      height: 10px;
      background: #0b0f19;
      border-radius: 5px;
      overflow: hidden;
      display: flex;
      margin-bottom: 8px;
    }
    .t-green { background: var(--accent-green); height: 100%; }
    .t-orange { background: #f59e0b; height: 100%; }
    .timeline-ticks {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Верхняя панель в стиле Sigenergy -->
  <div class="header-bar">
    <div class="brand-logo">
      <span>SIG</span>ENERGY / HUB
    </div>
    <div class="header-right">
      <button class="refresh-btn" id="refresh-btn" onclick="manualRefresh()">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
      <div class="status-pill">● Online</div>
    </div>
  </div>

  <!-- Главный блок схемы с анимированными потоками -->
  <div class="hero-card">
    <div class="hero-stats">
      <div class="mini-stat">
        <span>Заряд АКБ</span>
        <strong id="soc-val" style="color: var(--accent-green);">--%</strong>
      </div>
      <div class="mini-stat">
        <span>Енергія батареї</span>
        <strong id="kwh-val">-- кВт·год</strong>
      </div>
    </div>

    <!-- Мобильная SVG схема энергопотоков -->
    <div class="svg-container">
      <svg viewBox="0 0 340 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="glow-g" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Линия Сеть -> Инвертор -->
        <path d="M 50 40 L 140 40" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />
        <path id="svg-grid-flow" d="M 50 40 L 140 40" class="energy-flow" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow-g)" visibility="hidden" />
        <g id="svg-grid-cross" transform="translate(95, 40)">
          <circle cx="0" cy="0" r="10" fill="#ef4444" />
          <text x="0" y="3.5" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">✕</text>
        </g>

        <!-- Линия Инвертор -> Дом -->
        <path d="M 200 40 L 290 40" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />
        <path id="svg-house-flow" d="M 200 40 L 290 40" class="energy-flow" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow-g)" />

        <!-- Линия АКБ -> Инвертор (вертикальная) -->
        <path d="M 170 90 L 170 70" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />
        <path id="svg-bat-flow" d="M 170 90 L 170 70" class="energy-flow" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow-g)" visibility="hidden" />
        <polygon id="svg-bat-arrow" points="166,73 174,73 170,67" fill="#f59e0b" visibility="hidden" />

        <!-- Иконка ЛЭП -->
        <g transform="translate(20, 20)">
          <rect x="0" y="0" width="35" height="40" rx="10" fill="#141b2d" stroke="#334155" stroke-width="1.2"/>
          <text x="17.5" y="25" font-size="18" text-anchor="middle">🗼</text>
        </g>

        <!-- Инвертор (Центр) -->
        <g transform="translate(140, 15)">
          <rect x="0" y="0" width="60" height="50" rx="12" fill="#141b2d" stroke="#3b82f6" stroke-width="2"/>
          <text x="30" y="26" font-size="16" text-anchor="middle">⚡</text>
          <text x="30" y="42" font-size="7" text-anchor="middle" fill="#94a3b8" font-weight="bold">INVERTER</text>
        </g>

        <!-- Батарея под инвертором -->
        <g transform="translate(125, 80)">
          <rect x="0" y="0" width="90" height="22" rx="7" fill="#0b0f19" stroke="#10b981" stroke-width="1.2"/>
          <rect x="5" y="4" width="60" height="14" rx="3" fill="#10b981" opacity="0.2"/>
          <rect id="battery-fill-bar" x="5" y="4" width="30" height="14" rx="3" fill="#10b981"/>
          <text x="78" y="15" font-size="10" fill="#10b981" font-weight="bold">🔋</text>
        </g>

        <!-- Дом / Квартира (Справа) -->
        <g transform="translate(275, 15)">
          <rect x="0" y="0" width="45" height="50" rx="10" fill="#141b2d" stroke="#334155" stroke-width="1.2"/>
          <text x="22.5" y="30" font-size="20" text-anchor="middle">🏢</text>
        </g>
      </svg>
    </div>

    <div class="flow-status-footer">
      <div class="flow-status-left">
        <span>Джерело живлення</span>
        <strong id="power-source-text">Акумулятор (АКБ)</strong>
      </div>
      <div class="flow-status-right">
        <span>Споживання будинку</span>
        <strong id="load-power-val">-- кВт</strong>
      </div>
    </div>
  </div>

  <!-- Статус-баннер сети -->
  <div id="alert-banner" class="alert-banner offline">
    <div class="alert-icon">⚡</div>
    <div class="alert-text">
      <h3 id="banner-title">Мережа відсутня</h3>
      <p id="banner-subtitle">Живлення переведено на резерв</p>
    </div>
  </div>

  <!-- 3 основных показателя в ряд -->
  <div class="metrics-grid-3">
    <div class="metric-card">
      <span>Напруга мережі</span>
      <strong id="grid-v-card" style="color: var(--accent-red);">0 V</strong>
    </div>
    <div class="metric-card">
      <span>Навантаження</span>
      <strong id="load-v-card">-- кВт</strong>
    </div>
    <div class="metric-card">
      <span>Вихід AC</span>
      <strong id="out-v-card">230 V</strong>
    </div>
  </div>

  <!-- График / таймлайн дня -->
  <div class="analytics-card">
    <div class="analytics-title">
      <span>📅 Графік наявності світла</span>
      <span id="date-label">Сьогодні</span>
    </div>
    <div class="timeline-bar">
      <div class="t-orange" style="width: 40%;"></div>
      <div class="t-green" style="width: 60%;"></div>
    </div>
    <div class="timeline-ticks">
      <span>00:00</span>
      <span>06:00</span>
      <span>12:00</span>
      <span>18:00</span>
      <span>24:00</span>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://nzpfbvrbwmxhhpajgyjj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_htg_8lgoGKWP7Dx7eVlhDg_eLnr3Y10";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    document.getElementById('date-label').innerText = new Date().toLocaleDateString('uk-UA', { day: 'numeric', month: 'numeric' });

    async function fetchLatestData() {
      try {
        const { data, error } = await client
          .from('power_logs')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(1);

        if (error) { console.error(error); return; }

        if (data && data.length > 0) {
          const last = data[0];
          const hasGrid = last.grid_status === true || last.grid_status === "true";
          const soc = last.battery_soc || 0;
          const loadW = last.load_power || 0;
          const loadKw = (loadW / 1000).toFixed(2);
          const kwh = (soc * 0.10).toFixed(2);

          // DOM элементы
          const banner = document.getElementById('alert-banner');
          const bannerTitle = document.getElementById('banner-title');
          const bannerSub = document.getElementById('banner-subtitle');
          
          const gridFlow = document.getElementById('svg-grid-flow');
          const gridCross = document.getElementById('svg-grid-cross');
          const batFlow = document.getElementById('svg-bat-flow');
          const batArrow = document.getElementById('svg-bat-arrow');
          
          const socVal = document.getElementById('soc-val');
          const kwhVal = document.getElementById('kwh-val');
          const loadPowerVal = document.getElementById('load-power-val');
          const loadVCard = document.getElementById('load-v-card');
          const gridVCard = document.getElementById('grid-v-card');
          const powerSourceText = document.getElementById('power-source-text');
          const batteryBar = document.getElementById('battery-fill-bar');

          socVal.innerText = soc + '%';
          kwhVal.innerText = kwh + ' кВт·год';
          loadPowerVal.innerText = loadKw + ' кВт';
          loadVCard.innerText = loadKw + ' кВт';
          
          batteryBar.setAttribute('width', Math.max(5, (soc / 100) * 60));

          const gridV = last.grid_voltage !== null && last.grid_voltage !== undefined ? last.grid_voltage : (hasGrid ? 230 : 0);
          gridVCard.innerText = gridV + ' V';

          if (hasGrid) {
            banner.className = "alert-banner online";
            bannerTitle.innerText = "Мережа активна";
            bannerSub.innerText = "Міське живлення відновлено";
            gridVCard.style.color = "var(--accent-green)";
            powerSourceText.innerText = "Міська мережа + Заряд АКБ";
            
            gridFlow.setAttribute("visibility", "visible");
            gridCross.setAttribute("visibility", "hidden");
            batFlow.setAttribute("visibility", "hidden");
            batArrow.setAttribute("visibility", "hidden");
          } else {
            banner.className = "alert-banner offline";
            bannerTitle.innerText = "Світла немає";
            bannerSub.innerText = "Живлення від автономної батареї";
            gridVCard.style.color = "var(--accent-red)";
            powerSourceText.innerText = "Акумулятор (Резерв)";

            gridFlow.setAttribute("visibility", "hidden");
            gridCross.setAttribute("visibility", "visible");
            batFlow.setAttribute("visibility", "visible");
            batArrow.setAttribute("visibility", "visible");
          }
        }
      } catch (err) {
        console.error("Fetch error:", err);
      }
    }

    async function manualRefresh() {
      const btn = document.getElementById('refresh-btn');
      btn.classList.add('spinning');
      if (window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback) {
        Telegram.WebApp.HapticFeedback.impactOccurred('medium');
      }
      await fetchLatestData();
      setTimeout(() => btn.classList.remove('spinning'), 600);
    }

    fetchLatestData();
    setInterval(fetchLatestData, 20000);
  </script>
</body>
</html>
