name: Growatt Sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip' # Включаем кэширование, чтобы не тратить время на повторную скачку библиотек

      - name: Install dependencies
        run: |
          pip install requests supabase growattServer

      - name: Run sync script
        env:
          GROWATT_TOKEN: ${{ secrets.GROWATT_TOKEN }}
        run: |
          python growatt_sync.py
